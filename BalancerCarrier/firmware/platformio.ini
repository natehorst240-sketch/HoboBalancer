[platformio]
default_envs = balancercarrier

[env:balancercarrier]
platform = espressif32@6.12.0
; Unexpected Maker FeatherS3[D]: ESP32-S3, 16 MB flash, 8 MB QSPI PSRAM.
; The generic devkit board file is used deliberately - flash size, PSRAM mode and
; console are all pinned in sdkconfig.defaults rather than inherited from a board
; definition that may not match this module.
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = dio
; The esp32-s3-devkitc-1 manifest hard-codes 8 MB (upload.flash_size, maximum_size
; 8388608), and the partition-table check reads THAT, not sdkconfig - so a 16 MB
; partitions.csv failed the build with "does not fit in configured flash size 8MB"
; even though CONFIG_ESPTOOLPY_FLASHSIZE was already 16MB. Override both.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
monitor_speed = 115200
