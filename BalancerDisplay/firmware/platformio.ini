[platformio]
default_envs = balancerdisplay

[env:balancerdisplay]
; Same pinned platform as BalancerCarrier so the two firmwares share one toolchain.
platform = espressif32@6.12.0
; Generic ESP32-S3 board definition; flash, PSRAM mode and console are pinned in
; sdkconfig.defaults, GPIOs in src/board.hpp. See README for the FNK0115B module facts.
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_mode = dio
board_build.partitions = partitions.csv
monitor_speed = 115200
